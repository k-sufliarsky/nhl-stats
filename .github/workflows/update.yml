name: Update data and publish site

# A quick check runs often and asks: has the last game day finished, has it been HOURS_AFTER_LAST_START hours
# since its last game started, and is it not processed yet? Only then does the full update run: recompute ratings,
# commit the new data, publish the site.
# GitHub's scheduler is best-effort and often skips runs at :00 and :30, so the checks run at odd minutes:
# twice an hour overnight (US Eastern), and hourly the rest of the day so a skipped night is caught up next morning.
# Pushes to main also run the check (and always republish the site).
on:
  schedule:
    - cron: "23,53 3-12 * * *"
    - cron: "23 0-2,13-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Update now, even if nothing new has finished"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "nhl_ratings.py", "rating_model.py", "model/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

env:
  # How long after the day's last game starts to update. Games take about 2.5 hours; raise or lower to taste.
  HOURS_AFTER_LAST_START: "3"

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from October 2026
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Is there a finished game day to process?
        id: check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: python should_update.py

      - name: Restore NHL API cache
        if: steps.check.outputs.update == 'true'
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: nhl-api-${{ github.run_id }}
          restore-keys: nhl-api-

      - name: Recompute ratings
        if: steps.check.outputs.update == 'true'
        env:
          # Optional: a YouTube Data API key (repo secret) gives each game an exact link to the NHL's YouTube highlights.
          # Without it, games link to an exact-title YouTube search instead.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          pip install -r requirements.txt
          python nhl_ratings.py

      - name: Save NHL API cache
        if: steps.check.outputs.update == 'true'
        uses: actions/cache/save@v6
        with:
          path: cache
          key: nhl-api-${{ github.run_id }}

      - name: Commit new data
        id: commit
        if: steps.check.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data through ${{ steps.check.outputs.game_day }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # Publish when there's new data, and always on pushes, manual runs and re-runs. A re-run of just this job
    # reuses the update job's outputs from the first attempt, so it would otherwise skip again.
    if: >-
      github.event_name != 'schedule' || fromJSON(github.run_attempt) > 1 ||
      needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from October 2026
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
